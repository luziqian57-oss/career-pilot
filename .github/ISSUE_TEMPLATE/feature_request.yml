name: Feature request
description: Suggest an improvement to CareerPilot
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: checkboxes
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues for a similar request.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives and additional context
