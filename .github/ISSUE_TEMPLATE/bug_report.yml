name: Bug report
description: Report a reproducible problem in CareerPilot
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Never attach a real resume or API key.
  - type: checkboxes
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed personal information and secrets from this report.
          required: true
  - type: input
    attributes:
      label: CareerPilot version
      placeholder: 0.2.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Run mode
      options:
        - Docker Compose
        - Local Python
        - Other deployment
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
