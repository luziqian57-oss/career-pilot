[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-pilot"
version = "0.2.0"
description = "An extensible AI career agent backend for resume parsing and job matching."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CareerPilot Contributors" }]
keywords = ["ai-agent", "career", "fastapi", "langgraph", "resume-parser"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "langgraph>=0.2.50,<1.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30,<1.0",
  "redis>=5.2,<6.0",
  "openai>=1.57,<2.0",
  "pypdf>=5.1,<6.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "reportlab>=4.2,<6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/career_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["outputs", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
